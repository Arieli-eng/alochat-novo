<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AloChat - Sistema de Procedimentos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/config.css') }}">
</head>
<body class="config-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">AC</div>
                <span class="logo-text">AloChat</span>
            </div>
        </div>

        <div class="sidebar-user">
            <div class="user-avatar">A</div>
            <div class="user-info">
                <div class="user-name">Arieti</div>
                <div class="user-role">Gestora</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">GESTÃO</div>
                <a href="/" class="nav-item active">
                    <span class="nav-icon">⌂</span>
                    <span class="nav-text">Procedimentos</span>
                </a>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">CONFIGURAÇÕES</div>
                <a href="/config" class="nav-item">
                    <span class="nav-icon">⚙</span>
                    <span class="nav-text">Configurações</span>
                </a>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="content-header">
            <h1 class="page-title">Procedimentos</h1>
        </header>

        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="statTotalProc">-</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statComMatch">-</div>
                <div class="stat-label">Com Parceiros</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statCobertura">-</div>
                <div class="stat-label">Cobertura</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statParceiros">-</div>
                <div class="stat-label">Parceiros</div>
            </div>
        </div>

        <!-- Filters and Search -->
        <div class="content-toolbar">
            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input type="text" id="searchInput" placeholder="Buscar por nome ou código..." class="search-input">
            </div>

            <select id="categoriaFilter" class="filter-select">
                <option value="">Todas as Categorias</option>
            </select>

            <select id="prioridadeFilter" class="filter-select">
                <option value="">Todas as Prioridades</option>
            </select>

            <select id="cidadeFilter" class="filter-select">
                <option value="">Todas as Cidades</option>
            </select>

            <select id="bairroFilter" class="filter-select" disabled>
                <option value="">Todos os Bairros</option>
            </select>

            <button class="btn-filter" onclick="applyFilters()">Filtrar</button>
            <button class="btn-clear" onclick="clearFilters()">Limpar</button>
        </div>

        <!-- Content Area -->
        <div class="content-area" id="contentArea">
            <div class="items-list" id="tableBody">
                <!-- Será preenchido dinamicamente -->
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>
    </main>

    <!-- Modal de Parceiros -->
    <div id="modalParceiros" class="modal">
        <div class="modal-content modal-modern modal-large">
            <div class="modal-header-modern">
                <h2>Parceiros Disponíveis</h2>
                <button class="modal-close-modern" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body-modern" id="modalBody">
                <!-- Conteúdo será inserido via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>Carregando...</p>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
