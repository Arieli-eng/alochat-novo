<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - AloChat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/config.css') }}">
</head>
<body class="config-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">AC</div>
                <span class="logo-text">AloChat</span>
            </div>
        </div>

        <div class="sidebar-user">
            <div class="user-avatar">A</div>
            <div class="user-info">
                <div class="user-name">Arieti</div>
                <div class="user-role">Gestora</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">GESTÃO</div>
                <a href="/" class="nav-item">
                    <span class="nav-icon">⌂</span>
                    <span class="nav-text">Principal</span>
                </a>
            </div>

            <div class="nav-section">
                <div class="nav-section-title">CONFIGURAÇÕES</div>
                <a href="#" class="nav-item" data-section="credenciadores" onclick="showSection('credenciadores'); return false;">
                    <span class="nav-icon">⚕</span>
                    <span class="nav-text">Credenciadores</span>
                </a>
                <a href="#" class="nav-item" data-section="responsaveis" onclick="showSection('responsaveis'); return false;">
                    <span class="nav-icon">◉</span>
                    <span class="nav-text">Responsáveis</span>
                </a>
                <a href="#" class="nav-item" data-section="cidades" onclick="showSection('cidades'); return false;">
                    <span class="nav-icon">⌘</span>
                    <span class="nav-text">Cidades</span>
                </a>
                <a href="#" class="nav-item" data-section="sla" onclick="showSection('sla'); return false;">
                    <span class="nav-icon">⏲</span>
                    <span class="nav-text">SLA</span>
                </a>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="content-header">
            <button class="back-button" onclick="window.location.href='/'">
                <span>←</span>
            </button>
            <h1 class="page-title" id="pageTitle">Credenciadores</h1>
            <span class="updated-time" id="updatedTime">Atualizado há instantes</span>
        </header>

        <!-- Search and Actions -->
        <div class="content-toolbar">
            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input type="text" id="searchInput" placeholder="Digite o nome do cadastro..." class="search-input">
            </div>
            <button class="btn-add" id="addButton" onclick="openAddModal()">
                + Novo Cadastro
            </button>
        </div>

        <!-- Content Area -->
        <div class="content-area" id="contentArea">
            <!-- Será preenchido dinamicamente -->
        </div>
    </main>

    <!-- Modal Credenciador -->
    <div id="modalCredenciador" class="modal">
        <div class="modal-content modal-modern">
            <div class="modal-header-modern">
                <h2 id="credenciadorModalTitle">Novo Credenciador</h2>
                <button class="modal-close-modern" onclick="closeModal('modalCredenciador')">&times;</button>
            </div>
            <div class="modal-body-modern">
                <form id="formCredenciador" onsubmit="saveCredenciador(event)">
                    <input type="hidden" id="credenciadorId">

                    <div class="form-group-modern">
                        <label for="credenciadorNome">Nome *</label>
                        <input type="text" id="credenciadorNome" class="input-modern" required>
                    </div>

                    <div class="form-group-modern">
                        <label for="credenciadorCidadesVinculadas">Cidades de Atuação *</label>
                        <select id="credenciadorCidadesVinculadas" class="select-modern" multiple required>
                        </select>
                        <small class="input-hint">Segure Ctrl/Cmd para selecionar múltiplas cidades</small>
                    </div>

                    <div class="form-group-modern checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="credenciadorAtivo" checked>
                            <span>Ativo</span>
                        </label>
                    </div>

                    <div class="modal-actions-modern">
                        <button type="button" class="btn-secondary-modern" onclick="closeModal('modalCredenciador')">Cancelar</button>
                        <button type="submit" class="btn-primary-modern">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Responsável -->
    <div id="modalResponsavel" class="modal">
        <div class="modal-content modal-modern">
            <div class="modal-header-modern">
                <h2 id="responsavelModalTitle">Novo Responsável</h2>
                <button class="modal-close-modern" onclick="closeModal('modalResponsavel')">&times;</button>
            </div>
            <div class="modal-body-modern">
                <form id="formResponsavel" onsubmit="saveResponsavel(event)">
                    <input type="hidden" id="responsavelId">

                    <div class="form-group-modern">
                        <label for="responsavelNome">Nome *</label>
                        <input type="text" id="responsavelNome" class="input-modern" required>
                    </div>

                    <div class="form-group-modern">
                        <label for="responsavelEmail">Email</label>
                        <input type="email" id="responsavelEmail" class="input-modern">
                    </div>

                    <div class="form-group-modern checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="responsavelAtivo" checked>
                            <span>Ativo</span>
                        </label>
                    </div>

                    <div class="modal-actions-modern">
                        <button type="button" class="btn-secondary-modern" onclick="closeModal('modalResponsavel')">Cancelar</button>
                        <button type="submit" class="btn-primary-modern">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Cidade -->
    <div id="modalCidade" class="modal">
        <div class="modal-content modal-modern">
            <div class="modal-header-modern">
                <h2 id="cidadeModalTitle">Nova Cidade</h2>
                <button class="modal-close-modern" onclick="closeModal('modalCidade')">&times;</button>
            </div>
            <div class="modal-body-modern">
                <form id="formCidade" onsubmit="saveCidade(event)">
                    <input type="hidden" id="cidadeId">

                    <div class="form-group-modern">
                        <label for="cidadeNome">Nome *</label>
                        <input type="text" id="cidadeNome" class="input-modern" required>
                    </div>

                    <div class="form-group-modern">
                        <label for="cidadeEstado">Estado (UF) *</label>
                        <input type="text" id="cidadeEstado" class="input-modern" required maxlength="2"
                               style="text-transform: uppercase;" placeholder="SP">
                    </div>

                    <div class="form-group-modern">
                        <label for="cidadeObservacoes">Observações</label>
                        <textarea id="cidadeObservacoes" class="input-modern" rows="3"></textarea>
                    </div>

                    <div class="form-group-modern checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="cidadeAtiva" checked>
                            <span>Ativa</span>
                        </label>
                    </div>

                    <div class="modal-actions-modern">
                        <button type="button" class="btn-secondary-modern" onclick="closeModal('modalCidade')">Cancelar</button>
                        <button type="submit" class="btn-primary-modern">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal SLA -->
    <div id="modalSLA" class="modal">
        <div class="modal-content modal-modern">
            <div class="modal-header-modern">
                <h2>Editar SLA</h2>
                <button class="modal-close-modern" onclick="closeModal('modalSLA')">&times;</button>
            </div>
            <div class="modal-body-modern">
                <form id="formSLA" onsubmit="saveSLA(event)">
                    <input type="hidden" id="slaId">

                    <div class="form-group-modern">
                        <label for="slaPrioridade">Prioridade</label>
                        <input type="text" id="slaPrioridade" class="input-modern" disabled>
                    </div>

                    <div class="form-group-modern">
                        <label for="slaTempo">Tempo (dias) *</label>
                        <input type="number" id="slaTempo" class="input-modern" required min="1">
                    </div>

                    <div class="form-group-modern">
                        <label for="slaDescricao">Descrição</label>
                        <textarea id="slaDescricao" class="input-modern" rows="3"></textarea>
                    </div>

                    <div class="modal-actions-modern">
                        <button type="button" class="btn-secondary-modern" onclick="closeModal('modalSLA')">Cancelar</button>
                        <button type="submit" class="btn-primary-modern">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>Processando...</p>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
</body>
</html>
